[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "bittune-autopilot"
version = "0.1.0"
description = "Auditable single-GPU LLM inference Autopilot MVP"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.19.0",
    "click==8.4.2",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "langchain==1.3.14",
    "langchain-openai==1.4.1",
    "langgraph==1.2.10",
    "langgraph-checkpoint-postgres==3.1.1",
    "openai==2.53.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "psycopg[binary]==3.3.4",
    "psycopg-pool==3.3.1",
    "rfc8785==0.1.4",
    "rich==15.0.0",
    "sqlalchemy==2.0.51",
    "uvicorn==0.52.1",
    "textual==8.2.8",
]

[project.scripts]
autopilot = "autopilot.cli:main"

[project.optional-dependencies]
evidence = ["mlflow-skinny==3.15.1"]
optimization = ["optuna==4.9.0"]
tracking-server = ["mlflow==3.15.1"]
runner = [
    "docker==7.2.0",
    "nvidia-ml-py==13.610.43",
]

[dependency-groups]
dev = [
    "mypy==2.3.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/autopilot", "runner"]

[tool.hatch.build]
exclude = ["**/AGENTS.md"]

[tool.uv]
required-version = ">=0.12.0,<0.13.0"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions", "docs"]

[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "ARG",
    "ASYNC",
    "B",
    "C4",
    "DTZ",
    "E",
    "F",
    "I",
    "N",
    "PERF",
    "PIE",
    "PL",
    "PTH",
    "RET",
    "RUF",
    "S",
    "SIM",
    "T20",
    "TRY",
    "UP",
    "W",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "PLR2004", "S101"]
"src/autopilot/api/app.py" = ["ARG001", "PLR0915", "TRY003"]
"src/autopilot/cli.py" = ["PLR0912", "PLR0915", "TRY003", "TRY301"]
"src/autopilot/graph/workflow.py" = ["ARG002", "PLR0911", "PLR0915", "TRY003", "TRY301"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests/unit", "tests/contract"]
asyncio_mode = "strict"
