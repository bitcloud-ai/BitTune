{
  "api_version": "autopilot/v1",
  "kind": "CapabilityPackage",
  "metadata": {
    "name": "capacity",
    "package_version": "0.1.0"
  },
  "provider": {
    "name": "llm-d-planner",
    "version_constraint": null,
    "adapter_version": null,
    "execution_entrypoint": null
  },
  "implementation": {
    "deterministic_core": "implemented",
    "agent_tools": "planned",
    "provider_execution": "planned"
  },
  "requires": {
    "phases": ["planning"],
    "resources": {
      "cpu": true,
      "network": true,
      "gpu": false
    },
    "environment_capabilities": ["single_nvidia_gpu"]
  },
  "tools": [
    {
      "name": "create_capacity_plan",
      "visibility": "dynamic",
      "risk_level": "L0"
    }
  ],
  "schema_versions": [
    "capacity-planner-version-profile/v1",
    "capacity-planning-specification/v1",
    "planner-raw-estimate/v1",
    "capacity-estimate/v1",
    "capacity-plan/v1",
    "deployment-candidate/v1"
  ],
  "supports": {
    "modes": ["single_gpu"]
  }
}
