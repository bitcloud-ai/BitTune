{
  "api_version": "autopilot/v1",
  "kind": "CapabilityPackage",
  "metadata": {
    "name": "benchmark",
    "package_version": "0.1.0"
  },
  "provider": {
    "name": "evalscope",
    "version_constraint": null,
    "adapter_version": null,
    "execution_entrypoint": null
  },
  "implementation": {
    "deterministic_core": "implemented",
    "agent_tools": "planned",
    "provider_execution": "planned"
  },
  "requires": {
    "phases": [
      "benchmark",
      "optimization",
      "verification"
    ],
    "resources": {
      "cpu": true,
      "network": true,
      "gpu": false
    },
    "environment_capabilities": [
      "openai_compatible_endpoint"
    ]
  },
  "tools": [
    {
      "name": "create_benchmark_plan",
      "visibility": "dynamic",
      "risk_level": "L0"
    },
    {
      "name": "start_benchmark",
      "visibility": "dynamic",
      "risk_level": "L2"
    },
    {
      "name": "get_benchmark_status",
      "visibility": "dynamic",
      "risk_level": "L0"
    },
    {
      "name": "get_benchmark_result",
      "visibility": "dynamic",
      "risk_level": "L0"
    },
    {
      "name": "cancel_benchmark",
      "visibility": "dynamic",
      "risk_level": "L2"
    }
  ],
  "schema_versions": [
    "benchmark-execution-specification/v1",
    "evalscope-version-profile/v1",
    "compiled-evalscope-benchmark/v1",
    "benchmark-preview/v1",
    "evalscope-raw-report/v1",
    "benchmark-result/v1"
  ],
  "supports": {
    "modes": [
      "baseline",
      "closed_loop_sweep",
      "open_loop_sweep",
      "sla_search"
    ]
  }
}
