{
  "api_version": "autopilot/v1",
  "kind": "CapabilityPackage",
  "metadata": {
    "name": "deployment",
    "package_version": "0.1.0"
  },
  "provider": {
    "name": "vllm",
    "version_constraint": null,
    "adapter_version": null,
    "execution_entrypoint": null
  },
  "implementation": {
    "deterministic_core": "implemented",
    "agent_tools": "planned",
    "provider_execution": "planned"
  },
  "requires": {
    "phases": [
      "deployment"
    ],
    "resources": {
      "cpu": true,
      "network": true,
      "gpu": true
    },
    "environment_capabilities": [
      "single_nvidia_gpu",
      "docker_gpu",
      "vllm_single_gpu_candidate"
    ]
  },
  "tools": [
    {
      "name": "create_deployment_plan",
      "visibility": "dynamic",
      "risk_level": "L0"
    },
    {
      "name": "start_deployment",
      "visibility": "dynamic",
      "risk_level": "L2"
    },
    {
      "name": "get_deployment_status",
      "visibility": "dynamic",
      "risk_level": "L0"
    },
    {
      "name": "get_deployment_result",
      "visibility": "dynamic",
      "risk_level": "L0"
    },
    {
      "name": "cancel_deployment",
      "visibility": "dynamic",
      "risk_level": "L2"
    }
  ],
  "schema_versions": [
    "vllm-version-profile/v1",
    "deployment-execution-specification/v1",
    "compiled-vllm-deployment/v1",
    "deployment-preview/v1"
  ],
  "supports": {
    "modes": [
      "single_gpu"
    ]
  }
}
