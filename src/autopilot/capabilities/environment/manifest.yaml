    {
      "name": "get_environment_status",
      "visibility": "dynamic",
      "risk_level": "L0"
    },
    {
      "name": "get_environment_result",
      "visibility": "dynamic",
      "risk_level": "L0"
    },
    {
      "name": "cancel_environment_inspection",
      "visibility": "dynamic",
      "risk_level": "L1"
    }
  ],
  "schema_versions": [
    "environment-version-profile/v1",
    "environment-inspection-specification/v1",
    "environment-inspection-result/v1",
    "hardware-passport/v1"
