name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Create Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb4c170d6b0e3eaaf984254 # v2.2.1
        with:
          generate_release_notes: true