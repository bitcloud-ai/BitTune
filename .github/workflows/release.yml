name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb4c170d6b0e3eaaf984254 # v2.2.1
        with:
          generate_release_notes: true